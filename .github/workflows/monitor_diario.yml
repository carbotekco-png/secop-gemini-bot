name: Monitor Diario SECOP II

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitorear:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar monitoreo SECOP II
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATOS_GOV_TOKEN: ${{ secrets.DATOS_GOV_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_secop.py

      - name: Guardar historial de procesos enviados
        run: |
          if [ -f enviados.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add enviados.json
            git diff --staged --quiet || (git commit -m "Actualizar historial de enviados" && git push)
          fi
